name: 'common_transforms'
version: '1.0.1'
config-version: 2

# dbt Fusion エンジンでは必須です。Fusion は require-dbt-version の範囲に
# 2.0.0 を含むパッケージしかインストールしません。require-dbt-version を
# 書いていないパッケージは dbt deps の時点で拒否されます。
require-dbt-version: ">=1.10.0,<3.0.0"

macro-paths: ["macros"]
test-paths: ["tests"]

# 重要: ここで設定した vars は利用側プロジェクトには伝播しません。
# このパッケージのマクロが var('x') を呼ぶと、dbt は「ルートプロジェクト」の
# vars を参照します。このファイルの値ではありません。したがって以下の設定は
# このリポジトリを直接実行した場合にのみ有効で、利用側にとっての既定値では
# ありません。
#
# そのため各マクロは var() の2引数形式 var('unknown_string', 'UNKNOWN') で
# 固定値のフォールバックを渡しており、利用側が何も設定しなくても動作します。
#
# 例外は `constants` です。system_code や created_by は組織固有の値であり、
# 安全な既定値が存在しません。黙って既定値を使うより失敗させるべきなので、
# 利用側が未定義の場合 standard_constants() はコンパイルエラーになります。
# README の「利用側で必須の設定」を参照してください。
vars:
  unknown_string: 'UNKNOWN'
  unknown_number: -1
  epoch_date: '1900-01-01'
  constants:
    system_code: 'DEMO01'
    record_type: '1'
    created_by: 'BATCH'
