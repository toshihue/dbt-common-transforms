version: 2

models:
  - name: members_cleaned
    description: >
      raw_members with every common_transforms component applied. Diff this
      against the raw seed to see what each macro did.

    columns:
      - name: member_id
        data_tests:
          - unique
          - not_null

      - name: member_name
        description: >
          全角 → 半角, whitespace collapsed, then initcap. member_id 4 is
          whitespace-only in the source and comes through as NULL — that is
          normalize_text's nullif doing its job, not a bug.
        data_tests:
          # Catches the NULL on member_id 4. warn rather than error: you want
          # it visible on every run without breaking the build.
          - common_transforms.not_null_or_placeholder:
              config:
                severity: warn

      - name: email
        description: Lowercased, so it is safe to use as a join key.
        data_tests:
          - not_null

      - name: member_code
        description: 全角 → 半角 then uppercased.
        data_tests:
          - unique
          - not_null

      - name: region_code
        description: >
          NULL埋め with '99', which is itself a valid region_master code
          (不明). Unknown regions therefore still resolve in the join instead
          of dropping out of downstream reports.
        data_tests:
          - not_null
          - relationships:
              to: ref('region_master')
              field: region_code

      - name: region_name_ja
        description: Resolved from the region_master seed.
        data_tests:
          - not_null

      - name: order_count
        data_tests:
          - not_null

      - name: last_login_date
        description: NULL埋め with the epoch_date sentinel (1900-01-01).
        data_tests:
          - not_null
