# examples/ を独立した dbt プロジェクトにするための設定です。
#
# 目的は2つあります。
#
# 1. パッケージ本体（../）を「利用する側」として実際に動かし、マクロが
#    生成する SQL をウェアハウスに対して検証すること。
# 2. dbt platform のプロジェクトとして開けるようにすること。プロジェクト
#    設定の「Project subdirectory」に examples を指定すると、IDE から
#    このプロジェクトを実行できます。ローカルに dbt を入れずに、パッケージ
#    の編集と検証ができます。
#
# パッケージ本体（リポジトリ直下）に model-paths を足してはいけません。
# パッケージのモデルは利用側プロジェクトでビルドされるため、この検証用
# モデルが利用者の環境に紛れ込みます。検証用モデルは必ずこちら側に置いて
# ください。

name: 'common_transforms_examples'
version: '1.0.0'
config-version: 2

# dbt platform ではプロジェクトの接続設定から profiles.yml が生成される
# ため、この値は使われません。ローカル実行時のみ意味を持ちます。
profile: 'common_transforms_examples'

require-dbt-version: ">=1.10.0,<3.0.0"

# constant() と standard_constants() は、利用側にこの var がないと
# コンパイルエラーになります。examples は「利用側」なので、ここで定義
# する必要があります。
vars:
  constants:
    system_code: 'KIRIN01'
    record_type: '1'
    created_by: 'BATCH'
