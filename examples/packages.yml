# このファイルをプロジェクトのルート（dbt_project.yml と同じ階層）に置き、
# dbt deps を実行してください。models/ 配下に置くと無視されます。

packages:
  # コミュニティパッケージ。自作パッケージと併せて入れておく価値があります。
  # クロスデータベース対応のマクロ群は、部品化の優れたお手本です。
  - package: dbt-labs/dbt_utils
    version: 1.4.1

  # 自作パッケージ。revision には必ずタグを指定してください。ブランチを
  # 指定すると、自分のコミットなしに下流プロジェクトの出力が変わります。
  - git: "https://github.com/toshihue/dbt-common-transforms.git"
    revision: v1.0.0
