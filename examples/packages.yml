# Copy this into the root of your dbt project, then run `dbt deps`.

packages:
  # The community package. Worth installing alongside your own — its
  # cross-database macros are the canonical example of 部品化 done well.
  - package: dbt-labs/dbt_utils
    version: 1.4.1

  # Your own package. Always pin `revision` to a tag, never a branch:
  # a branch can change under you and silently alter a downstream project.
  - git: "https://github.com/toshihue/dbt-common-transforms.git"
    revision: v0.1.0
