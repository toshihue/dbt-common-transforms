version: 2

seeds:
  - name: raw_members
    description: >
      common_transforms の全部品を動作確認するための、意図的に汚したソース
      データです。全角スペース、前後の余分な空白、大文字小文字が不統一な
      メールアドレス、空白のみの氏名、そして文字列・数値・日付それぞれの
      NULL を含みます。

    config:
      # column_types の指定は省略できません。型推論に任せると:
      #   - region_code の '02' が数値の 2 になり、region_master
      #     （コードは '01'〜'99' の文字列）と結合できなくなります
      #   - postal_code と member_code の先頭のゼロが失われます
      # コード類は「数値に見えるが文字列」です。必ず明示してください。
      column_types:
        member_id: integer
        member_name: varchar(200)
        email: varchar(200)
        postal_code: varchar(20)
        member_code: varchar(20)
        region_code: varchar(2)
        order_count: integer
        last_login_date: date

    columns:
      - name: member_id
        description: 主キー。
        data_tests:
          - unique
          - not_null
